<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{{ page.title }}</title>
{% include meta.html %}    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      /* Custom sitewide styles - add to site.css eventually when you compress Bootstrap */
      /* Make room at the top for the fixed navbar and space at the bottom for Mobile Safari */
      /* Add bottom border to nav */
      /* Make text lighter sitewide for light/dark mode */
      body {
        padding-top: 3.3rem;
        padding-bottom: 6rem;
        color: rgb(var(--bs-tertiary-color-rgb));
      }
      nav {
        border-bottom-color: gray;
        border-bottom-style: solid;
        border-bottom-width: thin;
      }
      /* Remove phone number from nav on small devices */
      @media (max-width: 576px) {
        #phone-number { display: none }
      }
{% if page.url == '/' %}{% include home.css %}{% endif %}    </style>
  </head>
  <body>
    <div id="top-of-page"></div>
{% include theme.html %}    <header data-bs-theme="dark">
{% include nav.html nav=site.data.navigation.nav %}    </header>
    <main role="main">
      <div class="container">
{{ content }}      </div>
      <footer class="container">
        <p class="float-end">
          <a href="#top-of-page" class="back-to-top" aria-label="Back to top">Back to top</a>
        </p>
        <p>
          &copy; 2000–2026 Brian Kelly Masonry <!--&middot; 
          <a href="#">Privacy</a> &middot; 
          <a href="#">Terms</a>-->
        </p>
      </footer>
    </main>
    <!-- Compress this in an include site.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
{% if page.url == '/contact-us/' %}{% include contact-us.html %}{% endif %}  </body>
</html>
